services:
  # =========================
  # PostgreSQL + PostGIS
  # =========================
  postgres:
    image: postgis/postgis:16-3.4
    container_name: safezone-db
    environment:
      POSTGRES_USER: safezone
      POSTGRES_PASSWORD: safezone_dev_password
      POSTGRES_DB: safezone_india
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safezone -d safezone_india"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: safezone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Go Backend (API Gateway + All Services)
  # =========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safezone-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=safezone
      - DB_PASSWORD=safezone_dev_password
      - DB_NAME=safezone_india
      - DB_SSL_MODE=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-change-in-production
      - GATEWAY_PORT=8080
      - GATEWAY_ENV=development
      - AI_SERVICE_URL=http://ai-service:8090
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # =========================
  # Python AI/ML Service
  # =========================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: safezone-ai
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://safezone:safezone_dev_password@postgres:5432/safezone_india
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_SERVICE_PORT=8090
    depends_on:
      postgres:
        condition: service_healthy

  # =========================
  # Next.js Frontend
  # =========================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: safezone-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
